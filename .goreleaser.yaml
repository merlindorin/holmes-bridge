# Adapted from the `goreleaser:boilerplate` output.
#
# This repo ships two binaries, and container images are built by
# .github/workflows/image.yml rather than here. That split is deliberate:
# goreleaser's `dockers` is deprecated, and it builds one image per
# architecture, whereas a mixed-architecture cluster needs a single multi-arch
# manifest. Buildx does that in one step; goreleaser owns binaries, archives,
# checksums, SBOMs and signing.
version: 2

project_name: holmes-bridge

release:
  github:
    owner: merlindorin
    name: holmes-bridge
  footer: |
    ## Container images

    Built by the `image` workflow as a single multi-arch manifest, so one tag
    serves both amd64 and arm64 nodes:

    ```
    ghcr.io/merlindorin/holmes-bridge:{{ .Tag }}
    ```

builds:
  - id: holmes-bridge
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    main: ./cmd/holmes-bridge
    binary: holmes-bridge
    # Use the commit timestamp so a rebuild of the same commit is identical.
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{ .CommitDate }} -X main.buildSource={{ .GitURL }}

  - id: incidentio-mock
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    main: ./cmd/incidentio-mock
    binary: incidentio-mock
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{ .CommitDate }} -X main.buildSource={{ .GitURL }}

archives:
  - id: default
    ids: [holmes-bridge, incidentio-mock]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE.md
      # The scenarios the mock serves are useless without its fixtures.
      - fixtures/**/*

gomod:
  proxy: false

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}-checksums.txt'

source:
  enabled: true

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

signs:
  - cmd: cosign
    env: [COSIGN_EXPERIMENTAL=1]
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-certificate=${certificate}'
      - '--output-signature=${signature}'
      - '${artifact}'
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
