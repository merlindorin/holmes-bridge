{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "holmes-bridge.fullname" . }}
  labels:
    {{- include "holmes-bridge.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not .Values.httpRoute.parentRefs }}
  {{- fail "httpRoute.enabled needs httpRoute.parentRefs: the Gateway to attach to" }}
  {{- end }}
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  rules:
    - matches:
        - path:
            # Only the signature-verified webhook route is published. The bridge
            # also serves POST /investigations/{id}, which takes no credential,
            # so a prefix match on / would let anyone who resolves the hostname
            # start investigations and spend the model budget.
            type: Exact
            value: /webhooks/incidentio
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "holmes-bridge.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
