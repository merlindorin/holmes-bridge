{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "holmes-bridge.fullname" . }}-credentials
  labels:
    {{- include "holmes-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Read by the HolmesGPT subchart as well as the bridge, so the key is written
  # once rather than in two places that can drift.
  openrouter-api-key: {{ .Values.secrets.openrouterApiKey | quote }}
  {{- with .Values.secrets.incidentioApiKey }}
  INCIDENTIO_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.webhookSecret }}
  WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.alertmanagerToken }}
  ALERTMANAGER_TOKENS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.ntfyToken }}
  NTFY_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.holtToken }}
  HOLT_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
