apiVersion: v2
name: holmes-bridge
description: Investigate incident.io incidents with HolmesGPT and write the analysis back
type: application
version: 0.3.0
appVersion: "0.3.0"
home: https://github.com/merlindorin/holmes-bridge
sources:
  - https://github.com/merlindorin/holmes-bridge
maintainers:
  - name: merlindorin
keywords:
  - incident.io
  - holmesgpt
  - sre

# HolmesGPT ships as a subchart so one `helm install` brings up the whole stack.
# Set holmes.enabled=false to point the bridge at a HolmesGPT you already run.
dependencies:
  - name: holmes
    version: "0.40.0"
    repository: https://robusta-charts.storage.googleapis.com
    condition: holmes.enabled
