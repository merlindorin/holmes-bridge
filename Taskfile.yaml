version: '3'

includes:
    claude: .tk/claude/Taskfile.yaml #!tk
    default: .tk/default/Taskfile.yaml
    git: .tk/git/Taskfile.yaml
    golangci: .tk/golangci/Taskfile.yaml
    goreleaser: .tk/goreleaser/Taskfile.yaml
    install: .tk/install/Taskfile.yaml
    license: .tk/license/Taskfile.yaml

dotenv:
  - .env
  - .env.default

tasks:
  # ---------------------------------------------------------------- code ----

  build:
    desc: Build both binaries into ./bin
    cmds:
      - go build -o bin/holmes-bridge ./cmd/holmes-bridge
      - go build -o bin/incidentio-mock ./cmd/incidentio-mock

  test:
    desc: Run the test suite
    cmd: go test ./...

  test:race:
    desc: Run the test suite under the race detector
    cmd: go test -race ./...

  lint:
    desc: Lint the Go sources
    cmd: go tool golangci-lint run ./...

  generate:
    desc: Regenerate the OpenAPI server and client
    cmd: go generate ./api/...

  spec:refresh:
    desc: Re-trim the incident.io spec from upstream, then regenerate
    summary: |
      Downloads the current incident.io OpenAPI spec, trims it to the operations
      this repo implements, and regenerates the Go code.

      Review the diff to api/incidentio/openapi.yaml before committing: a changed
      wire type is the whole point of tracking it.
    cmds:
      - python3 hack/trim-spec.py
      - task: generate

  # -------------------------------------------------------------- holmes ----

  holmes:install:
    desc: Install HolmesGPT into the current cluster, backed by OpenRouter
    summary: |
      Installs the upstream robusta/holmes chart into whatever cluster kubectl is
      pointed at. You create the cluster; this does not.

        kind create cluster --name holmes
        export OPENROUTER_API_KEY=sk-or-...
        task holmes:install

      The chart grants Holmes cluster-wide read access, so this refuses a context
      that does not look local unless you pass ALLOW_REMOTE_CLUSTER=1.
    cmd: ./hack/install-holmes.sh

  holmes:uninstall:
    desc: Remove HolmesGPT from the current cluster
    vars:
      NAMESPACE: '{{ .HOLMES_NAMESPACE | default "holmes" }}'
      RELEASE: '{{ .HOLMES_RELEASE | default "holmes" }}'
    cmds:
      - helm uninstall {{.RELEASE}} --namespace {{.NAMESPACE}} --ignore-not-found
      - kubectl delete namespace {{.NAMESPACE}} --ignore-not-found

  holmes:status:
    desc: Show which models and toolsets HolmesGPT came up with
    summary: |
      Port-forwards briefly and reads /api/info — how you check that your
      OpenRouter key works and the Kubernetes toolsets are healthy, before
      spending a real investigation on them.
    vars:
      NAMESPACE: '{{ .HOLMES_NAMESPACE | default "holmes" }}'
    cmds:
      - kubectl get pods -n {{.NAMESPACE}} -l app=holmes
      - ./hack/holmes-info.sh

  holmes:logs:
    desc: Tail the HolmesGPT logs
    vars:
      NAMESPACE: '{{ .HOLMES_NAMESPACE | default "holmes" }}'
      RELEASE: '{{ .HOLMES_RELEASE | default "holmes" }}'
    cmd: kubectl logs -n {{.NAMESPACE}} deployment/{{.RELEASE}}-holmes -f --tail 100

  holmes:port-forward:
    desc: Forward HolmesGPT to localhost:15050
    vars:
      NAMESPACE: '{{ .HOLMES_NAMESPACE | default "holmes" }}'
      RELEASE: '{{ .HOLMES_RELEASE | default "holmes" }}'
      PORT: '{{ .TEST_HOLMES_PORT | default "15050" }}'
    cmd: kubectl port-forward -n {{.NAMESPACE}} svc/{{.RELEASE}}-holmes {{.PORT}}:80

  # ---------------------------------------------------------------- demo ----

  demo:
    desc: Run the whole loop against the HolmesGPT in your cluster
    summary: |
      Brings up the incident.io mock and the bridge, port-forwards to the Holmes
      installed by `task holmes:install`, applies the broken workload, and prints
      what to curl. Ctrl-C stops everything and leaves the cluster alone.

      Investigations call a real model through OpenRouter, so they take a minute
      or two and cost money.
    cmd: ./hack/demo.sh

  demo:workload:
    desc: Apply the deliberately broken workload the demo investigates
    summary: |
      A checkout-api that crashloops because postgres-primary has no endpoints.
      This is what gives HolmesGPT something real to find.
    cmd: kubectl apply -f hack/demo-workload.yaml

  demo:workload:delete:
    desc: Remove the broken demo workload
    cmd: kubectl delete -f hack/demo-workload.yaml --ignore-not-found

  webhook:send:
    desc: Send a correctly-signed incident.io webhook to the bridge
    summary: |
      Verifies the receiving end without waiting for a real incident. Signs the
      payload, so a 401 means a secret mismatch rather than a mistake in a curl.

        task webhook:send                                  # local bridge
        task webhook:send -- https://my-peer.example.com   # through a tunnel
    cmd: ./hack/send-webhook.sh {{.CLI_ARGS}}
