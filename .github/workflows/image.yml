# Builds and publishes the container image.
#
# Multi-arch because a home cluster is rarely uniform: an image built only for
# the machine that built it will not schedule on half the nodes.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: build binaries for every target arch
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "dist/linux/$arch"
            for cmd in holmes-bridge incidentio-mock; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
                -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" \
                -o "dist/linux/$arch/$cmd" "./cmd/$cmd"
            done
          done
          cp -r fixtures dist/

      - name: write the runtime Dockerfile
        run: |
          cat > dist/Dockerfile <<'DOCKERFILE'
          FROM gcr.io/distroless/static-debian12
          ARG TARGETARCH
          COPY linux/${TARGETARCH}/holmes-bridge /usr/bin/holmes-bridge
          COPY linux/${TARGETARCH}/incidentio-mock /usr/bin/incidentio-mock
          COPY fixtures /fixtures
          ENTRYPOINT ["/usr/bin/holmes-bridge"]
          CMD ["incidentio", "serve"]
          DOCKERFILE

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
