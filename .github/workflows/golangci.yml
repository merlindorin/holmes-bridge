# Diverges from the `golangci:ci` boilerplate on purpose.
#
# The generated workflow installs a prebuilt golangci-lint through the action.
# That binary is compiled against whatever Go its release used, and refuses a
# go.mod targeting a newer one:
#
#   can't load config: the Go language version (go1.25) used to build
#   golangci-lint is lower than the targeted Go version (1.26.5)
#
# Running it as a Go tool instead builds it with this repo's own toolchain and
# the version pinned in go.mod, so CI and `task golangci:lint` are the same
# command by construction rather than by two settings someone has to keep equal.
name: golangci-lint
on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    strategy:
      matrix:
        go: ['1.26']
        os: [ubuntu-latest]
    name: lint
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: golangci-lint
        run: go tool golangci-lint run -c .golangci.yaml ./...
