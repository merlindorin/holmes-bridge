  /v2/alerts:
    get:
      description: "List all alerts for your account.\n\t\t\nThis endpoint supports a number of filters, which can help find alerts matching certain\ncriteria. These filters work similarly to the filters on the incidents endpoint, where \na field is specified alongside a comparison operator in the query string.\n\nNote that:\n- Filters may be used together, and the result will be alerts that match all filters.\n- All query parameters must be URI encoded.\n\n### By deduplication_key\n\nFind all alerts with deduplication_key ABC:\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'deduplication_key[is]=ABC'\n\n### By status\n\nFind all alerts in a firing state:\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'status[one_of]=firing'\n\n### By alert_source\n\nFind all alerts from a specific alert source (by alert source ID):\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'alert_source[one_of]=01GBSQF3FHF7FWZQNWGHAVQ804'\n\nFind all alerts not from a specific alert source:\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'alert_source[not_in]=01GBSQF3FHF7FWZQNWGHAVQ804'\n\n### By alert_group_id\n\nFind all alerts in a specific alert group:\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'alert_group_id[one_of]=01GBSQF3FHF7FWZQNWGHAVQ804'\n\n### By created_at\nFind all alerts that follow specified date parameters for created_at field.\nPossible values are \"gte\" (greater than or equal to), \"lte\" (less than or equal to), and \n\"date_range\" (between two dates). The following example finds all alerts created after \n2025-01-01:\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'created_at[gte]=2025-01-01'\n\nTo find alerts created within a specific date range, use the date_range option with \ntilde-separated dates:\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'created_at[date_range]=2024-12-02~2024-12-08'\n\n### By updated_at\nFind all alerts that follow specified date parameters for updated_at field, using the same\n\"gte\", \"lte\" and \"date_range\" operators as created_at. This is useful for incrementally\nsyncing alerts: poll with updated_at[gte] set to your last sync time instead of re-fetching\nthe full history. Note that updated_at moves whenever the alert row is written, which can\nhappen without a visible change to the alert payload, so treat matches as candidates to\nre-fetch rather than guaranteed changes — and overlap your sync window by a few minutes to\nallow for writes that commit out of timestamp order:\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'updated_at[gte]=2025-01-01T00:00:00Z'\n\n### By has_notes\n\nFind all alerts that have notes attached:\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'has_notes[is]=true'\n\nFind all alerts that have no notes attached:\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'has_notes[is]=false'\n\n### By attributes\n\nAlerts can be filtered by their attribute values. Each filter is keyed by the alert\nattribute ID, followed by an operator and the values to match. The accepted operators\ndepend on the attribute's type.\n\nFind all alerts where attribute 01GBSQF3FHF7FWZQNWGHAVQ804 is one of two catalog entries:\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'attributes[01GBSQF3FHF7FWZQNWGHAVQ804][one_of]=01GBSQF3FHF7FWZQNWGHAVQ804' \\\n\t\t\t--data 'attributes[01GBSQF3FHF7FWZQNWGHAVQ804][one_of]=01ET65M7ZARSFZ6TFDFVQDN9AA'\n\nYou can filter on multiple attributes at once, and the result will be alerts that match\nall of them.\n\n### Maintenance windows\nBy default, all alerts are returned including those held by a maintenance window.\nTo exclude alerts that are held by a maintenance window:\n\n\t\tcurl --get 'https://api.incident.io/v2/alerts' \\\n\t\t\t--data 'include_maintenance_window[is]=false'\n\t\t"
      operationId: AlertsV2List
      parameters:
        - allowEmptyValue: true
          description: Number of alerts to return per page
          in: query
          name: page_size
          required: true
          schema:
            default: 25
            description: Number of alerts to return per page
            format: int64
            maximum: 50
            minimum: 1
            type: integer
        - allowEmptyValue: true
          description: If provided, pass this as the 'after' param to load the next page
          in: query
          name: after
          schema:
            description: If provided, pass this as the 'after' param to load the next page
            type: string
        - allowEmptyValue: true
          description: Filter on alert deduplication key. The accepted operator is 'is'.
          in: query
          name: deduplication_key
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            description: Filter on alert deduplication key. The accepted operator is 'is'.
            type: object
        - allowEmptyValue: true
          description: Filter on alert status. The accepted operators are 'one_of', or 'not_in'.
          in: query
          name: status
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            description: Filter on alert status. The accepted operators are 'one_of', or 'not_in'.
            type: object
        - allowEmptyValue: true
          description: Filter on alert source by ID. The accepted operators are 'one_of', or 'not_in'.
          in: query
          name: alert_source
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            description: Filter on alert source by ID. The accepted operators are 'one_of', or 'not_in'.
            type: object
        - allowEmptyValue: true
          description: Filter on alert group ID. Returns alerts that belong to any of the specified groups. The accepted operator is 'one_of'.
          in: query
          name: alert_group_id
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            description: Filter on alert group ID. Returns alerts that belong to any of the specified groups. The accepted operator is 'one_of'.
            type: object
        - allowEmptyValue: true
          description: Filter on alert created at timestamp. Accepted operators are 'gte', 'lte' and 'date_range'.
          in: query
          name: created_at
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            description: Filter on alert created at timestamp. Accepted operators are 'gte', 'lte' and 'date_range'.
            type: object
        - allowEmptyValue: true
          description: Filter on alert updated at timestamp. Accepted operators are 'gte', 'lte' and 'date_range'.
          in: query
          name: updated_at
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            description: Filter on alert updated at timestamp. Accepted operators are 'gte', 'lte' and 'date_range'.
            type: object
        - allowEmptyValue: true
          description: Filter on an alerts attributes. Alert attribute ID should be sent, followed by the operator and values. Accepted operator will depend on the attribute type.
          in: query
          name: attributes
          schema:
            additionalProperties:
              additionalProperties:
                items:
                  type: string
                type: array
              type: object
            description: Filter on an alerts attributes. Alert attribute ID should be sent, followed by the operator and values. Accepted operator will depend on the attribute type.
            type: object
        - allowEmptyValue: true
          description: Filter on whether an alert has notes. The accepted operator is 'is'.
          in: query
          name: has_notes
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            description: Filter on whether an alert has notes. The accepted operator is 'is'.
            type: object
        - allowEmptyValue: true
          description: Filter on whether to include maintenance window alerts. The accepted operator is 'is'.
          in: query
          name: include_maintenance_window
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            description: Filter on whether to include maintenance window alerts. The accepted operator is 'is'.
            type: object
      responses:
