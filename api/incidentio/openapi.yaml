  /v3/follow_ups:
    get:
      description: |
        List follow-ups for an organisation.

        Results are paginated and ordered by follow-up ID, oldest first. Use the <code>after</code>
        value from <code>pagination_meta</code> to fetch the next page; it is only set when there
        may be more results.

        ### By created_at and updated_at

        Both timestamp filters accept the operators "gte" (greater than or equal to), "lte" (less
        than or equal to) and "date_range" (between two dates). The following example finds all
        follow-ups updated after 2025-01-01:

        		curl --get 'https://api.incident.io/v3/follow_ups' \
        			--data 'updated_at[gte]=2025-01-01T00:00:00Z'

        To find follow-ups created within a specific date range, use the date_range operator with
        tilde-separated dates:

        		curl --get 'https://api.incident.io/v3/follow_ups' \
        			--data 'created_at[date_range]=2024-12-02~2024-12-08'

        Filtering on updated_at is useful for incrementally syncing follow-ups: poll with
        updated_at[gte] set to your last sync time instead of re-fetching the full history. Two
        caveats: updated_at moves whenever the follow-up row itself is written, but changes to
        embedded objects (e.g. an assignee being renamed, or an external issue's status text) can
        alter the payload without bumping it. And timestamps are stamped before commit, so a
        follow-up can become visible with an older updated_at than rows you have already seen —
        overlap your sync window by a few minutes to allow for writes that commit out of
        timestamp order.
      operationId: FollowUpsV3List
      parameters:
        - allowEmptyValue: true
          description: Integer number of records to return
          in: query
          name: page_size
          schema:
            default: 25
            description: Integer number of records to return
            format: int64
            maximum: 250
            minimum: 1
            type: integer
        - allowEmptyValue: true
          description: A follow-up's ID. This endpoint will return a list of follow-ups after this ID in relation to the API response order.
          in: query
          name: after
          schema:
            description: A follow-up's ID. This endpoint will return a list of follow-ups after this ID in relation to the API response order.
            type: string
        - allowEmptyValue: true
          description: Find follow-ups related to this incident
