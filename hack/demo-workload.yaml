# A deliberately broken workload for the demo.
#
# Without this, Holmes investigates an incident about a service that does not
# exist in your cluster and correctly reports that it cannot find anything —
# which proves the plumbing but demonstrates nothing.
#
# The fault here is real and diagnosable from the cluster alone:
#
#   - checkout-api crashloops, and its logs name what it could not reach.
#   - postgres-primary is a Service with a selector that matches no pods, so it
#     has no endpoints. That is the actual root cause.
#
# A working investigation should get from the CrashLoopBackOff to the empty
# Endpoints object. Applied by `task demo:workload`, removed by
# `task demo:workload:delete`.

apiVersion: v1
kind: Namespace
metadata:
  name: checkout-demo
  labels:
    app.kubernetes.io/part-of: holmes-bridge-demo
    app.kubernetes.io/managed-by: holmes-bridge
    # So nobody investigating a real alert wonders what this is.
    purpose: test-fixture
  annotations:
    holmes-bridge/warning: >-
      TEST FIXTURE — this workload is broken on purpose, to give HolmesGPT
      something to investigate. It is not a real service and nothing depends on
      it. Remove it with: task demo:workload:delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: checkout-demo
  labels:
    app: checkout-api
    purpose: test-fixture
  annotations:
    holmes-bridge/warning: "TEST FIXTURE — broken on purpose. Not a real service."
    # Holmes reads annotations; give it the same breadcrumb a real service would
    # carry, so the investigation can mention the deploy.
    kubernetes.io/change-cause: "Deploy v2.31.0 — change database connection pool configuration"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        version: v2.31.0
    spec:
      containers:
        - name: checkout-api
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "$(date -Iseconds) INFO  starting checkout-api v2.31.0"
              echo "$(date -Iseconds) INFO  connection pool: max=100 min=10"
              echo "$(date -Iseconds) INFO  connecting to postgres-primary.checkout-demo.svc.cluster.local:5432"
              sleep 3
              echo "$(date -Iseconds) ERROR dial tcp: lookup postgres-primary.checkout-demo.svc.cluster.local: no endpoints available"
              echo "$(date -Iseconds) FATAL could not acquire a database connection after 3 attempts; exiting"
              exit 1
          env:
            - name: DATABASE_HOST
              value: postgres-primary.checkout-demo.svc.cluster.local
            - name: DATABASE_PORT
              value: "5432"
            - name: POOL_MAX_CONNECTIONS
              value: "100"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: checkout-demo
spec:
  selector:
    app: checkout-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# The root cause: this Service selects pods that do not exist, so its Endpoints
# object is empty and every lookup from checkout-api fails.
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: checkout-demo
spec:
  selector:
    app: postgres-primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
